name: fagoo
services:
  postgres:
    image: postgres:17-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
    restart: unless-stopped
    environment:
      POSTGRES_DB: fagoo
      POSTGRES_USER: fagoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U fagoo -d fagoo"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g
    shm_size: 128mb
    command: [postgres, -c, shared_buffers=256MB, -c, max_connections=60, -c, work_mem=4MB, -c, maintenance_work_mem=64MB]
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
    networks: [internal]
  api:
    image: ${FAGOO_IMAGE:?Verified application image required}
    restart: unless-stopped
    init: true
    depends_on:
      postgres: {condition: service_healthy}
    environment: &app-environment
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgresql://fagoo:${POSTGRES_PASSWORD}@postgres:5432/fagoo
      FAGOO_PUBLIC_URL: ${FAGOO_PUBLIC_URL:?Public HTTPS origin required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Authentication secret required}
      FAGOO_UPDATER_SOCKET: /run/fagoo/updater.sock
      FAGOO_UPDATER_TOKEN_FILE: /run/secrets/updater-token
      FAGOO_VERSION: ${FAGOO_VERSION:-source}
      FAGOO_PROXY_SECRET: ${FAGOO_PROXY_SECRET:-}
      FAGOO_R2_ENDPOINT: ${FAGOO_R2_ENDPOINT:-}
      FAGOO_R2_BUCKET: ${FAGOO_R2_BUCKET:-}
      FAGOO_R2_ACCESS_KEY_ID: ${FAGOO_R2_ACCESS_KEY_ID:-}
      FAGOO_R2_SECRET_ACCESS_KEY: ${FAGOO_R2_SECRET_ACCESS_KEY:-}
    ports: ["127.0.0.1:${FAGOO_LOCAL_PORT:-8080}:3000"]
    volumes:
      - /run/fagoo:/run/fagoo:ro
      - ${FAGOO_HOME:-/opt/fagoo}/secrets/updater-token:/run/secrets/updater-token:ro
    group_add: ["${FAGOO_UPDATER_GID:-1000}"]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    logging: *logging
    networks: [internal, egress]
  jobs:
    image: ${FAGOO_IMAGE:?Verified application image required}
    command: [node, apps/api/src/jobs.mjs]
    restart: unless-stopped
    init: true
    depends_on:
      postgres: {condition: service_healthy}
    environment: *app-environment
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    logging: *logging
    networks: [internal, egress]
  cloudflared:
    image: cloudflare/cloudflared@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    profiles: [edge]
    restart: unless-stopped
    command: [tunnel, --no-autoupdate, run, --token, "${CLOUDFLARE_TUNNEL_TOKEN:-}"]
    depends_on: [api]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    logging: *logging
    networks: [egress]
networks:
  internal:
    internal: true
  egress: {}
volumes:
  postgres-data: {}
